<!DOCTYPE html>
<html>
<head>
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<style>
body, html {
    height: 100%;
    margin: 0;
}

.bgimg {
    background-image: url('https://img.freepik.com/free-photo/view-nuclear-power-plant-with-towers-letting-out-steam-from-process_23-2150957698.jpg');
    height: 100%;
    background-position: center;
    background-size: cover;
    position: relative;
    color: white;
    font-family: "Courier New", Courier, monospace;
    font-size: 25px;
}

.topleft {
    position: absolute;
    top: 0;
    left: 16px;
}

.topright {
    position: absolute;
    top: 0;
    right: 16px;
}

.bottomleft {
    position: absolute;
    bottom: 0;
    left: 16px;
}

.middle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.hr {
    margin: auto;
    width: 40%;
}

/* Add CSS for the bottom-right button */
.bottom-right {
    position: absolute;
    bottom: 10px;
    right: 10px;
}
</style>
<body>

<div class="bgimg">
    <div class="topleft">
        <p>OM ENGINEERING</p>
    </div>
    <div class="topright">
        <img src="logo.png" alt="Logo" style="width:100px;height:auto;">
    </div>
    <div class="middle">
        <h1>COMING SOON</h1>
        <hr>
        <p>Lesser days everyday</p>
    </div>
    <div class="bottomleft">
        <p>Mail: info@omengg.org</p>
    </div>
    <!-- Button at the bottom right -->
    <div class="bottom-right">
        <a href="https://forms.gle/jw4P9eHp4D6U5Yi47" class="btn btn-primary" target="_blank">Employee Leave Form</a>
    </div>
</div>

</body>
</html>
